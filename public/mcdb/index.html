<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC DB Browser</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --head:#f4f4f4; --accent:#2a6fdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151515; --fg:#e8e8e8; --muted:#999; --line:#333; --head:#1f1f1f; --accent:#6ea0ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:flex; min-height:100vh; }
  nav { width:220px; border-right:1px solid var(--line); padding:12px; flex-shrink:0; }
  nav h1 { font-size:15px; margin:0 0 12px; }
  nav button { display:flex; justify-content:space-between; width:100%; padding:6px 8px; margin-bottom:2px;
    background:none; border:0; border-radius:4px; color:var(--fg); cursor:pointer; text-align:left; font:inherit; }
  nav button:hover { background:var(--head); }
  nav button.active { background:var(--accent); color:#fff; }
  nav small { color:inherit; opacity:.7; }
  main { flex:1; padding:12px; min-width:0; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .bar input, .bar select, .bar button { font:inherit; padding:4px 8px; background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:4px; }
  .bar button { cursor:pointer; }
  .muted { color:var(--muted); }
  .wrap { overflow:auto; border:1px solid var(--line); border-radius:4px; max-height:calc(100vh - 90px); }
  table { border-collapse:collapse; width:max-content; min-width:100%; }
  th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;
    max-width:420px; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  th { position:sticky; top:0; background:var(--head); cursor:pointer; user-select:none; }
  td.null { color:var(--muted); font-style:italic; }
  @media (max-width: 700px) { body { flex-direction:column; } nav { width:auto; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<nav><h1>Minecraft DB</h1><div id="tables" class="muted">Loading…</div></nav>
<main>
  <div class="bar">
    <select id="fcol"></select><input id="fval" placeholder="equals…"><button id="fadd">Filter</button>
    <span id="filters"></span>
    <span style="flex:1"></span>
    <button id="prev">‹ Prev</button><span id="page" class="muted"></span><button id="next">Next ›</button>
  </div>
  <div class="wrap"><table id="grid"></table></div>
</main>
<script>
const API = '/api/v1/mc/tables';
const LIMIT = 100;
const state = { table: null, offset: 0, sort: null, dir: 'desc', filters: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function getJson(url) {
  const r = await fetch(url);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

async function loadTables() {
  try {
    const { tables } = await getJson(API);
    $('tables').innerHTML = '';
    tables.forEach(t => {
      const b = document.createElement('button');
      b.innerHTML = `<span>${esc(t.name)}</span><small>${t.rows.toLocaleString()}</small>`;
      b.onclick = () => { state.table = t.name; state.offset = 0; state.sort = null; state.filters = {}; loadRows(); };
      b.dataset.name = t.name;
      $('tables').appendChild(b);
    });
    if (!tables.length) $('tables').textContent = 'No tables found.';
  } catch (e) { $('tables').textContent = 'Error: ' + e.message; }
}

async function loadRows() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.name === state.table));
  const q = new URLSearchParams({ limit: LIMIT, offset: state.offset, dir: state.dir, ...state.filters });
  if (state.sort) q.set('sort', state.sort);
  let data;
  try { data = await getJson(`${API}/${encodeURIComponent(state.table)}?${q}`); }
  catch (e) { $('grid').innerHTML = `<tr><td>Error: ${esc(e.message)}</td></tr>`; return; }

  const cols = data.columns.map(c => c.name);
  $('fcol').innerHTML = cols.map(c => `<option>${esc(c)}</option>`).join('');
  $('filters').innerHTML = Object.entries(state.filters)
    .map(([k, v]) => `<button data-k="${esc(k)}">${esc(k)} = ${esc(v)} ✕</button>`).join(' ');
  $('filters').querySelectorAll('button').forEach(b => b.onclick = () => { delete state.filters[b.dataset.k]; state.offset = 0; loadRows(); });

  const arrow = c => c === state.sort ? (state.dir === 'asc' ? ' ▲' : ' ▼') : '';
  $('grid').innerHTML =
    `<thead><tr>${cols.map(c => `<th data-c="${esc(c)}">${esc(c)}${arrow(c)}</th>`).join('')}</tr></thead><tbody>` +
    data.rows.map(r => `<tr>${cols.map(c => r[c] === null
      ? '<td class="null">null</td>'
      : `<td title="${esc(r[c])}">${esc(r[c])}</td>`).join('')}</tr>`).join('') + '</tbody>';
  $('grid').querySelectorAll('th').forEach(th => th.onclick = () => {
    state.dir = state.sort === th.dataset.c && state.dir === 'desc' ? 'asc' : 'desc';
    state.sort = th.dataset.c; state.offset = 0; loadRows();
  });

  const end = Math.min(data.offset + data.rows.length, data.total);
  $('page').textContent = data.total ? `${data.offset + 1}–${end} of ${data.total.toLocaleString()}` : '0 rows';
  $('prev').disabled = data.offset === 0;
  $('next').disabled = end >= data.total;
}

$('prev').onclick = () => { state.offset = Math.max(0, state.offset - LIMIT); loadRows(); };
$('next').onclick = () => { state.offset += LIMIT; loadRows(); };
$('fadd').onclick = () => {
  if (!state.table) return;
  state.filters[$('fcol').value] = $('fval').value; $('fval').value = ''; state.offset = 0; loadRows();
};
$('fval').onkeydown = e => { if (e.key === 'Enter') $('fadd').click(); };
loadTables();
</script>
</body>
</html>
